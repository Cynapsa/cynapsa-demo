# Run Loki with -config.file=... -config.expand-env=true.
# Use workload IAM, not static keys. Keep compactor singleton.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /var/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  tsdb_shipper:
    active_index_directory: /var/loki/index
    cache_location: /var/loki/index_cache
  aws:
    s3: s3://${AWS_REGION}
    bucketnames: ${LOKI_BUCKET}
compactor:
  working_directory: /var/loki/compactor
  retention_enabled: true
  delete_request_store: s3
limits_config:
  allow_structured_metadata: true
  # Compactor-managed query retention; S3 versions may physically persist.
  retention_period: 168h
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
analytics:
  reporting_enabled: false
