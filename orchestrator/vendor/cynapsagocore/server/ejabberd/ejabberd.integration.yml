hosts:
  - mesh.test

loglevel: info
auth_method: internal
auth_password_format: scram
auth_scram_hash: sha256
resource_conflict: closeold
ca_file: /opt/ejabberd/conf/ca.pem
certfiles:
  - /opt/ejabberd/conf/server.pem

listen:
  -
    port: 5222
    ip: "0.0.0.0"
    module: ejabberd_c2s
    max_stanza_size: 524288
    access: c2s
    starttls_required: true

acl:
  local:
    user_regexp: ""

access_rules:
  local:
    allow: local
  c2s:
    allow: all

api_permissions:
  "local isolated probe":
    from: ejabberd_ctl
    who: all
    what: "*"

shaper:
  fast: 1000000

shaper_rules:
  max_user_sessions: 2
  max_user_offline_messages: 100
  c2s_shaper: fast
  s2s_shaper: fast

modules:
  mod_disco: {}
  mod_mam:
    db_type: mnesia
    assume_mam_usage: false
    default: never
    request_activates_archiving: false
  mod_offline:
    db_type: mnesia
    access_max_user_messages: max_user_offline_messages
  mod_ping: {}
  mod_roster: {}
  mod_shared_roster:
    db_type: mnesia
  mod_stream_mgmt:
    resend_on_timeout: if_offline
    resume_timeout: 300
  mod_time: {}
  mod_admin_extra: {}
  mod_cynapsa_mesh:
    control_ack_timeout_seconds: 5
    control_pending_max: 65536
    mailbox_max_messages: 1024
    mailbox_max_bytes: 67108864
    mailbox_retention_seconds: 86400
    mailbox_audit_log: true
