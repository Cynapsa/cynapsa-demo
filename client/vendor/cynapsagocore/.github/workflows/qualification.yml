name: Trusted Docker qualification

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: go1.26.6
  CYNAPSA_CANDIDATE_COMMIT: ${{ github.sha }}
  CYNAPSA_E2E_ARTIFACT_DIR: ${{ runner.temp }}/cynapsa-qualification/${{ github.run_id }}-${{ github.run_attempt }}/e2e

jobs:
  docker-qualification:
    name: Serialized integration, E2E, faults, Coturn, and release
    if: >-
      github.repository == 'Cynapsa/cynapsagocore' &&
      ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, linux, x64, cynapsa-docker-qualification]
    environment: docker-qualification
    timeout-minutes: 240
    concurrency:
      group: cynapsa-docker-qualification-${{ github.repository_id }}
      cancel-in-progress: false
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out the trusted event commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
      - name: Verify qualification runner capabilities
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v docker
          command -v cc
          command -v openssl
          docker info >/dev/null
          test "$(go env GOVERSION)" = go1.26.6
      - name: Run serialized integration and binding conformance
        run: go test -v -count=1 ./integration
      - name: Run external black-box E2E and ejabberd qualification
        run: go test -v -count=1 -timeout=20m ./test/e2e
      - name: Retain sanitized E2E qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CYNAPSA_E2E_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14
      - name: Run serialized TCP and HTTP fault qualification
        run: go test -v -count=1 ./test/production/faults
      - name: Run focused independent-NAT remote mesh smoke
        run: go test -v -count=1 ./test/production/coturn -run '^TestRemoteMeshSmoke$'
      - name: Run serialized NAT, STUN, and TURN qualification
        run: go test -v -count=1 -timeout=30m ./test/production/coturn
      - name: Build and verify reproducible native release candidate
        run: go test -v -count=1 ./test/production/release
