# Run Tempo with -config.file=... -config.expand-env=true.
# Use workload IAM (task role / IRSA / Pod Identity), not static keys.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: ${TEMPO_BUCKET}
      region: ${AWS_REGION}
compactor:
  compaction:
    # Query/block retention target, not physical erasure of S3 versions/backups.
    block_retention: 168h
usage_report:
  reporting_enabled: false
