<!doctype html>
<meta charset="utf-8">
<title>Opening Cynapsa</title>
<p id="status">Opening the local Cynapsa portal...</p>
<script>
const status = document.getElementById("status");
fetch("http://localhost:5174/session", {cache: "no-store"})
  .then(response => {
    if (!response.ok) throw new Error(`session refresh returned ${response.status}`);
    return response.json();
  })
  .then(session => {
    localStorage.setItem("cynapsa_access_token", session.access_token);
    location.replace(session.destination);
  })
  .catch(error => {
    status.textContent = `Could not establish the local portal session: ${error.message}`;
  });
</script>
<noscript>JavaScript is required to establish the local portal session.</noscript>
