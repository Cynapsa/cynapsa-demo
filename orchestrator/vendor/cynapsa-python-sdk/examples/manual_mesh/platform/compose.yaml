name: cynapsa-local-platform

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - platform

services:
  postgres:
    <<: *service
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cynapsa
      POSTGRES_USER: cynapsa
      POSTGRES_PASSWORD_FILE: /run/cynapsa/postgres-password
    volumes:
      - ${CYNAPSA_PLATFORM_STATE:?set CYNAPSA_PLATFORM_STATE}/secrets/postgres-password:/run/cynapsa/postgres-password:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U cynapsa -d cynapsa"]
      interval: 2s
      timeout: 3s
      retries: 45

  auth0:
    <<: *service
    build:
      context: ${CYNAPSA_TESTS_PATH:?set CYNAPSA_TESTS_PATH}/services/auth0-emulator
    entrypoint: [/platform/auth0-entrypoint.sh]
    environment:
      AUTH0_EMULATOR_HOST: auth0.cynapsa.test:8443
      AUTH0_EMULATOR_ISSUER: https://auth0.cynapsa.test:8443/
      AUTH0_EMULATOR_CLIENT_ID: cynapsa-local-client
      AUTH0_EMULATOR_API_AUDIENCE: https://api.cynapsa.test
      AUTH0_EMULATOR_ADDITIONAL_AUDIENCES: https://mesh.test,cynapsa-local-spa
      AUTH0_EMULATOR_SIGNING_KEY_PATH: /run/cynapsa/auth0-signing-key.pem
      AUTH0_EMULATOR_TLS_CERT_PATH: /run/cynapsa/tls.crt
      AUTH0_EMULATOR_TLS_KEY_PATH: /run/cynapsa/tls.key
      AUTH0_EMULATOR_PORT: "8443"
    volumes:
      - ./auth0-entrypoint.sh:/platform/auth0-entrypoint.sh:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/auth0-client-secret:/run/cynapsa/auth0-client-secret:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/auth0-bootstrap-secret:/run/cynapsa/auth0-bootstrap-secret:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/auth0-signing-key.pem:/run/cynapsa/auth0-signing-key.pem:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/auth0.crt:/run/cynapsa/tls.crt:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/auth0.key:/run/cynapsa/tls.key:ro
    healthcheck:
      test: [CMD, python, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz',context=ssl._create_unverified_context(),timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 45
    networks:
      platform:
        aliases:
          - auth0.cynapsa.test

  ejabberd:
    <<: *service
    build:
      context: ${CYNAPSA_EJABBERD_PATH:?set CYNAPSA_EJABBERD_PATH}
      dockerfile: Dockerfile
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    entrypoint: [/platform/ejabberd-entrypoint.sh]
    environment:
      ERL_CRASH_DUMP: /dev/null
    ports:
      - "127.0.0.1:5222:5222"
      - "127.0.0.1:5443:5443"
    volumes:
      - ./ejabberd-entrypoint.sh:/platform/ejabberd-entrypoint.sh:ro
      - ${CYNAPSA_PLATFORM_STATE}/config/ejabberd.yml:/opt/ejabberd/conf/ejabberd.yml:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/ejabberd.crt:/opt/ejabberd/conf/certs/fullchain.pem:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/ejabberd.key:/opt/ejabberd/conf/certs/privkey.pem:ro
      - ${CYNAPSA_PLATFORM_STATE}/public/auth0.jwks:/opt/ejabberd/conf/auth0.jwks:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/ejabberd-api-password:/run/cynapsa/ejabberd-api-password:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/erlang-cookie:/opt/ejabberd/.erlang.cookie:ro
      - ejabberd-data:/opt/ejabberd/database
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=9000,gid=9000
      - /opt/ejabberd/logs:rw,noexec,nosuid,nodev,size=32m,uid=9000,gid=9000
    depends_on:
      auth0:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "/opt/ejabberd/bin/ejabberdctl status >/dev/null 2>&1 && /opt/ejabberd/bin/ejabberdctl cynapsa_mesh_ready devices.example.com >/dev/null 2>&1"]
      interval: 2s
      timeout: 4s
      retries: 45
      start_period: 8s
    networks:
      platform:
        aliases:
          - mesh.test
          - devices.example.com

  management:
    <<: *service
    build:
      context: ${CYNAPSA_MANAGEMENT_PATH:?set CYNAPSA_MANAGEMENT_PATH}/backend
      dockerfile: Dockerfile
    entrypoint: [/platform/management-entrypoint.sh]
    environment:
      AUTH0_DOMAIN: auth0.cynapsa.test:8443
      AUTH0_API_AUDIENCE: https://api.cynapsa.test
      AUTH0_M2M_CLIENT_ID: cynapsa-local-client
      AUTH0_SPA_CLIENT_ID: cynapsa-local-spa
      RUNTIME_TOKEN_ISSUER_MODE: password
      DEVICE_DOMAIN: devices.example.com
      DEVICE_IDENTITY_DOMAIN: devices.example.com
      XMPP_SERVER_DOMAIN: devices.example.com
      XMPP_CLIENT_HOST: devices.example.com
      XMPP_CLIENT_PORT: "5222"
      TENANT_DOMAIN_SUFFIX: cynapsa.test
      EJABBERD_URL: https://devices.example.com:5443
      EJABBERD_ADMIN_USER: admin@devices.example.com
      EJABBERD_MESH_API_MODE: cynapsa
      SSL_CERT_FILE: /run/cynapsa/ca.pem
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8444:8443"
    volumes:
      - ./management-entrypoint.sh:/platform/management-entrypoint.sh:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/postgres-password:/run/cynapsa/secrets/postgres-password:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/auth0-client-secret-management:/run/cynapsa/secrets/auth0-client-secret:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/management-jwt-secret:/run/cynapsa/secrets/management-jwt-secret:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/enrollment-credential-key:/run/cynapsa/secrets/enrollment-credential-key:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/management-enrollment-service-token:/run/cynapsa/secrets/management-enrollment-service-token:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/ejabberd-api-password-management:/run/cynapsa/secrets/ejabberd-api-password:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/combined-ca.crt:/run/cynapsa/ca.pem:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/management.crt:/run/cynapsa/tls.crt:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/management.key:/run/cynapsa/tls.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      auth0:
        condition: service_healthy
      ejabberd:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/healthz',context=ssl._create_unverified_context(),timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 60
    networks:
      platform:
        aliases:
          - management.cynapsa.test

  enrollment:
    <<: *service
    build:
      context: ${CYNAPSA_ENROLLMENT_PATH:?set CYNAPSA_ENROLLMENT_PATH}
      dockerfile: Dockerfile
    cap_add: [NET_BIND_SERVICE]
    entrypoint: [/platform/enrollment-entrypoint.sh]
    environment:
      MANAGEMENT_BASE_URL: https://management.cynapsa.test:8443
      SSL_CERT_FILE: /run/cynapsa/ca.pem
      REQUEST_TIMEOUT_SECONDS: "10"
      PUBLIC_REQUEST_TIMEOUT_SECONDS: "10"
      MANAGEMENT_TOTAL_TIMEOUT_SECONDS: "10"
    volumes:
      - ./enrollment-entrypoint.sh:/platform/enrollment-entrypoint.sh:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/enrollment-management-service-token:/run/cynapsa/enrollment-management-service-token:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/combined-ca.crt:/run/cynapsa/ca.pem:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/enrollment.crt:/run/cynapsa/tls.crt:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/enrollment.key:/run/cynapsa/tls.key:ro
    depends_on:
      management:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:443/healthz',context=ssl._create_unverified_context(),timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 45
    networks:
      platform:
        aliases:
          - enrollment.cynapsa.com

  portal-session:
    image: python:3.13-slim-bookworm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: [python, /platform/bootstrap_portal.py]
    ports:
      - "127.0.0.1:5174:8081"
    volumes:
      - ./bootstrap_portal.py:/platform/bootstrap_portal.py:ro
      - ${CYNAPSA_PLATFORM_STATE}/secrets/auth0-bootstrap-secret:/run/cynapsa/auth0-bootstrap-secret:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/combined-ca.crt:/run/cynapsa/ca.pem:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz',timeout=2).read()"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      management:
        condition: service_healthy
    networks:
      - platform

  portal:
    <<: *service
    build:
      context: ${CYNAPSA_MANAGEMENT_PATH:?set CYNAPSA_MANAGEMENT_PATH}/frontend
      dockerfile: Dockerfile
    command: [/platform/portal-entrypoint.sh]
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: https://management.cynapsa.test:8443
      VITE_AUTH0_DOMAIN: auth0.cynapsa.test:8443
      VITE_AUTH0_CLIENT_ID: cynapsa-local-spa
      VITE_AUTH0_AUDIENCE: https://api.cynapsa.test
      NODE_EXTRA_CA_CERTS: /run/cynapsa/ca.pem
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./local-login.html:/app/public/local-login.html:ro
      - ./portal-entrypoint.sh:/platform/portal-entrypoint.sh:ro
      - ${CYNAPSA_PLATFORM_STATE}/certs/combined-ca.crt:/run/cynapsa/ca.pem:ro
    depends_on:
      portal-session:
        condition: service_healthy

networks:
  platform:
    name: cynapsa-local-platform

volumes:
  postgres-data: {}
  ejabberd-data: {}
