# Run Tempo with -config.file=... -config.expand-env=true.
# Use Workload Identity / ADC, not a service-account key.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: gcs
    wal:
      path: /var/tempo/wal
    gcs:
      bucket_name: ${TEMPO_BUCKET}
compactor:
  compaction:
    # Query/block retention target, not physical erasure under GCS soft delete.
    block_retention: 168h
usage_report:
  reporting_enabled: false
