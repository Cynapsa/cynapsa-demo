name: Go core CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: go1.26.6

jobs:
  build-unit:
    name: Build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
      - name: Verify exact toolchain
        run: test "$(go env GOVERSION)" = go1.26.6
      - name: Validate executable issue regression manifest
        run: test/regression/run.sh manifest
      - name: Build every package
        run: go build ./...
      - name: Run non-Docker tests
        run: |
          mapfile -t packages < <(go list ./... | grep -Ev '(/integration|/test/e2e|/test/production/(coturn|faults|release))$')
          test "${#packages[@]}" -gt 0
          go test -count=1 "${packages[@]}"

  targeted-race:
    name: Complete non-Docker race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
      - name: Run every non-Docker package under the race detector
        run: |
          mapfile -t packages < <(go list ./... | grep -Ev '(/integration|/test/e2e|/test/production/(coturn|faults|release))$')
          test "${#packages[@]}" -gt 0
          go test -race -count=1 "${packages[@]}"

  static-analysis:
    name: Vet and module integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet all packages
        run: go vet ./...
      - name: Verify tidy module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vulnerability-scan:
    name: Govulncheck v1.7.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
      - name: Scan reachable symbols
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  abi-conformance:
    name: ABI, conformance, and native smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go 1.26.6
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: 1.26.6
          check-latest: false
          cache: true
      - name: Validate security-model documentation
        run: go test -count=1 ./test/doccontract
      - name: Run native wrapper and C smoke tests
        run: go test -count=1 ./cmd/cynapsacore-shared
      - name: Match ABI schema, header, and symbol allowlists
        run: go test -count=1 ./test/production/release -run '^TestV1ABIContractMatchesHeaderAndLinkerAllowLists$'
