global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Keep the exporter-supplied job/instance derived from service.name and
    # service.instance.id; do not replace them with the scrape target labels.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:9464"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
