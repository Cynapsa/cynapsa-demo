hosts:
  - "devices.example.com"

# Local state generation also creates a Coturn secret for compatibility with
# the shared secure-state helper. This authority-only profile does not expose it.
# @CYNAPSA_TURN_STATIC_AUTH_SECRET@

loglevel: info
auth_method:
  - internal
  - cynapsa_jwt
auth_password_format: scram
auth_scram_hash: sha256
auth_external_user_exists_check: false
default_db: mnesia
resource_conflict: closeold

certfiles:
  - /opt/ejabberd/conf/certs/fullchain.pem
  - /opt/ejabberd/conf/certs/privkey.pem

listen:
  - port: 5222
    ip: "::"
    module: ejabberd_c2s
    max_stanza_size: 524288
    access: c2s
    starttls_required: true
  - port: 5443
    ip: "::"
    module: ejabberd_http
    tls: true
    request_handlers:
      /api: mod_http_api

acl:
  admin:
    user:
      - "admin@devices.example.com"

access_rules:
  c2s:
    - allow

api_permissions:
  "local platform controller":
    who:
      - access:
          - allow:
              - acl: admin
    what:
      - cynapsa_mesh_ready
      - cynapsa_mesh_create
      - cynapsa_mesh_add
      - cynapsa_mesh_remove
      - cynapsa_mesh_remove_many
      - cynapsa_mesh_snapshot
      - cynapsa_attachment_authorize
      - cynapsa_installation_invalidate
      - cynapsa_auth_policy_apply
      - cynapsa_runtime_sessions
      - connected_users
      - registered_users
  "local console":
    from: ejabberd_ctl
    who: all
    what: "*"

modules:
  mod_disco: {}
  mod_adhoc: {}
  mod_admin_extra: {}
  mod_http_api: {}
  mod_mam:
    db_type: mnesia
    assume_mam_usage: false
    default: never
    request_activates_archiving: false
  mod_offline:
    db_type: mnesia
  mod_ping:
    send_pings: true
    ping_interval: 30 seconds
    ping_ack_timeout: 30 seconds
    timeout_action: kill
  mod_roster:
    db_type: mnesia
  mod_shared_roster:
    db_type: mnesia
  mod_stream_mgmt:
    resend_on_timeout: if_offline
    resume_timeout: 300
  mod_time: {}
  mod_cynapsa_mesh:
    auth_mode: runtime_v2
    jwt_issuer: "https://auth0.cynapsa.test:8443/"
    jwt_audience: "https://api.cynapsa.test"
    jwks_file: /opt/ejabberd/conf/auth0.jwks
    runtime_identity_mode: registry
    jwt_clock_skew_seconds: 30
    jwks_unknown_kid_refresh_seconds: 30
