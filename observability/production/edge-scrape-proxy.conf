# Reference NGINX config for a sidecar in the edge Collector's network namespace.
# Only this mTLS port may be reachable from central Prometheus via private routing.
# A node_exporter sidecar must see the same queue mount at /var/lib/otelcol/queue.
events {}
http {
  server {
    listen 9443 ssl;
    server_name _;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/otel/tls/scrape-server.crt;
    ssl_certificate_key /run/otel/tls/scrape-server.key;
    ssl_client_certificate /run/otel/tls/prometheus-ca.crt;
    ssl_verify_client on;

    location = /collector/metrics {
      proxy_pass http://127.0.0.1:8888/metrics;
    }
    location = /disk/metrics {
      proxy_pass http://127.0.0.1:9100/metrics;
    }
    location / {
      return 404;
    }
  }
}
