name: cynapsa-simple-e2e

x-sidecar: &sidecar
  build:
    context: ../..
    dockerfile: e2e/simple/Dockerfile.sidecar
  image: cynapsa-simple-e2e-sidecar:${CYNAPSA_E2E_IMAGE_TAG:-local}
  cap_drop: [ALL]
  cap_add: [NET_ADMIN]
  security_opt: [no-new-privileges:true]
  read_only: true
  sysctls:
    net.ipv4.tcp_retries2: "1"
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  volumes:
    - ${CYNAPSA_E2E_RUNTIME_DIR:?set CYNAPSA_E2E_RUNTIME_DIR}/ca.pem:/ca.pem:ro
  depends_on:
    router:
      condition: service_healthy
  healthcheck:
    test:
      - CMD-SHELL
      - >
        ! ip -4 -o address show dev eth0 scope global | grep -q . &&
        ! ip -4 route show dev eth0 | grep -q . &&
        ip -d link show cynapsa-lan | grep -Fq "vlan protocol 802.1Q id $${CYNAPSA_VLAN_ID} " &&
        ip -4 -o address show dev cynapsa-lan scope global |
          awk '{print $$4}' | grep -Fxq "$${CYNAPSA_LAN_ADDRESS}" &&
        ip route show 10.240.0.0/16 |
          grep -Fq "via $${CYNAPSA_LAN_GATEWAY} dev cynapsa-lan" &&
        test "$$(sysctl -n net.ipv4.tcp_retries2)" = 1 &&
        ! iptables -t nat -S | grep -Eq '(MASQUERADE|SNAT|DNAT)'
    interval: 2s
    timeout: 2s
    retries: 20
  networks:
    trunk:

x-agent: &agent
  build:
    context: ../..
    dockerfile: e2e/simple/Dockerfile.agent
    additional_contexts:
      core: ${CYNAPSA_GO_CORE_PATH:?set CYNAPSA_GO_CORE_PATH}
  image: cynapsa-simple-e2e-agent:${CYNAPSA_E2E_IMAGE_TAG:-local}
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=10001,gid=10001
  volumes:
    - ${CYNAPSA_E2E_RUNTIME_DIR:?set CYNAPSA_E2E_RUNTIME_DIR}/ca.pem:/ca.pem:ro
  environment: &agent-environment
    CYNAPSA_MESH_ENDPOINT: 10.240.70.2:5222
    CYNAPSA_MESH_ID: simple-e2e
  depends_on:
    ejabberd:
      condition: service_healthy

x-fault-campaign-client-environment: &fault-campaign-client-environment
  CYNAPSA_E2E_RPC_TIMEOUT_MS: "60000"

x-server: &server
  <<: *agent
  restart: "no"
  healthcheck:
    test: [CMD-SHELL, "test -f /tmp/cynapsa-ready"]
    interval: 2s
    timeout: 1s
    retries: 45
    start_period: 5s

services:
  router:
    build:
      context: ../..
      dockerfile: e2e/simple/Dockerfile.router
    image: cynapsa-simple-e2e-router:${CYNAPSA_E2E_IMAGE_TAG:-local}
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4m
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
    healthcheck:
      test: [CMD-SHELL, "test \"$$(cat /proc/sys/net/ipv4/ip_forward)\" = 1 && ! ip -4 -o address show dev eth0 scope global | grep -q . && ! ip -4 route show dev eth0 | grep -q . && test \"$$(ip -d link show type vlan | grep -c '^[0-9]')\" = 9 && test \"$$(sysctl -n net.ipv4.conf.all.send_redirects)\" = 0 && ! iptables -t nat -S | grep -Eq '(MASQUERADE|SNAT|DNAT)'"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.2"}

  ejabberd-net:
    <<: *sidecar
    environment:
      CYNAPSA_VLAN_ID: 107
      CYNAPSA_LAN_ADDRESS: 10.240.70.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.70.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.17"}

  stun-net:
    <<: *sidecar
    environment:
      CYNAPSA_VLAN_ID: 108
      CYNAPSA_LAN_ADDRESS: 10.240.80.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.80.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.18"}

  turn-net:
    <<: *sidecar
    environment:
      CYNAPSA_VLAN_ID: 109
      CYNAPSA_LAN_ADDRESS: 10.240.90.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.90.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.19"}

  native-server-net:
    <<: *sidecar
    environment:
      CYNAPSA_VLAN_ID: 105
      CYNAPSA_LAN_ADDRESS: 10.240.50.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.50.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.15"}

  monkey-server-net:
    <<: *sidecar
    environment:
      CYNAPSA_VLAN_ID: 106
      CYNAPSA_LAN_ADDRESS: 10.240.60.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.60.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.16"}

  native-sync-client-net:
    <<: *sidecar
    profiles: [clients]
    environment:
      CYNAPSA_VLAN_ID: 101
      CYNAPSA_LAN_ADDRESS: 10.240.10.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.10.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.11"}

  native-async-client-net:
    <<: *sidecar
    profiles: [clients]
    environment:
      CYNAPSA_VLAN_ID: 102
      CYNAPSA_LAN_ADDRESS: 10.240.20.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.20.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.12"}

  monkey-sync-client-net:
    <<: *sidecar
    profiles: [clients]
    environment:
      CYNAPSA_VLAN_ID: 103
      CYNAPSA_LAN_ADDRESS: 10.240.30.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.30.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.13"}

  monkey-async-client-net:
    <<: *sidecar
    profiles: [clients]
    environment:
      CYNAPSA_VLAN_ID: 104
      CYNAPSA_LAN_ADDRESS: 10.240.40.2/24
      CYNAPSA_LAN_GATEWAY: 10.240.40.1
    networks:
      trunk: {ipv4_address: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.14"}

  ejabberd:
    build:
      context: ${CYNAPSA_EJABBERD_PATH:?set CYNAPSA_EJABBERD_PATH}
      dockerfile: Dockerfile
    image: cynapsa-simple-e2e-ejabberd:${CYNAPSA_E2E_IMAGE_TAG:-local}
    user: "9000:9000"
    cap_drop: [ALL]
    # The pinned upstream beam.smp carries this file capability, even though
    # the E2E listener itself uses an unprivileged port.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    network_mode: service:ejabberd-net
    volumes:
      - ${CYNAPSA_E2E_RUNTIME_DIR}/ejabberd.yml:/opt/ejabberd/conf/ejabberd.yml:ro
      - ${CYNAPSA_E2E_RUNTIME_DIR}/ca.pem:/opt/ejabberd/conf/ca.pem:ro
      - ${CYNAPSA_E2E_RUNTIME_DIR}/server.pem:/opt/ejabberd/conf/server.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=9000,gid=9000
      - /opt/ejabberd/database:rw,noexec,nosuid,nodev,size=64m,uid=9000,gid=9000
      - /opt/ejabberd/logs:rw,noexec,nosuid,nodev,size=32m,uid=9000,gid=9000
      - /opt/ejabberd/upload:rw,noexec,nosuid,nodev,size=64m,uid=9000,gid=9000
    depends_on:
      ejabberd-net:
        condition: service_healthy
      stun:
        condition: service_healthy
      turn:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "ejabberdctl status >/dev/null 2>&1 && ejabberdctl cynapsa_mesh_ready mesh.test >/dev/null 2>&1"]
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 8s

  stun:
    image: coturn/coturn@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    user: nobody:nogroup
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    network_mode: service:stun-net
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${CYNAPSA_E2E_RUNTIME_DIR}/coturn-stun.conf:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534
      - /var/lib/turn:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534
    depends_on:
      stun-net:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "turnutils_stunclient -p 3478 10.240.80.2 >/dev/null 2>&1"]
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 4s

  turn:
    image: coturn/coturn@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    user: nobody:nogroup
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    network_mode: service:turn-net
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ${CYNAPSA_E2E_RUNTIME_DIR}/coturn-turn.conf:/etc/coturn/turnserver.conf:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534
      - /var/lib/turn:rw,noexec,nosuid,nodev,size=8m,uid=65534,gid=65534
    depends_on:
      turn-net:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          test -f /tmp/cynapsa-turn-ready || {
            secret=$$(awk -F= '$$1 == "static-auth-secret" {print $$2; exit}' /etc/coturn/turnserver.conf) &&
            test -n "$$secret" &&
            turnutils_uclient -y -W "$$secret" -m 1 -n 1 -p 3478 10.240.90.2 >/dev/null 2>&1 &&
            touch /tmp/cynapsa-turn-ready;
          }
      interval: 2s
      timeout: 8s
      retries: 30
      start_period: 4s

  native-server:
    <<: *server
    network_mode: service:native-server-net
    command: ["python", "-m", "cynapsa_e2e.native_server"]
    environment:
      <<: *agent-environment
      CYNAPSA_USERNAME: native-server@mesh.test
      CYNAPSA_PASSWORD: ${NATIVE_SERVER_PASSWORD:?set NATIVE_SERVER_PASSWORD}
    depends_on:
      native-server-net:
        condition: service_healthy
      ejabberd:
        condition: service_healthy

  monkey-server:
    <<: *server
    network_mode: service:monkey-server-net
    command:
      - cynapsa
      - run
      - --mesh-endpoint
      - 10.240.70.2:5222
      - --username
      - monkey-server@mesh.test
      - --mesh-id
      - simple-e2e
      - --password-env
      - CYNAPSA_PASSWORD
      - --allow
      - "*"
      - "*"
      - --
      - uvicorn
      - cynapsa_e2e.monkey_fastapi_server:app
      - --host
      - 127.0.0.1
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=1).read()"
      interval: 2s
      timeout: 2s
      retries: 45
      start_period: 5s
    environment:
      <<: *agent-environment
      CYNAPSA_USERNAME: monkey-server@mesh.test
      CYNAPSA_PASSWORD: ${MONKEY_SERVER_PASSWORD:?set MONKEY_SERVER_PASSWORD}
    depends_on:
      monkey-server-net:
        condition: service_healthy
      ejabberd:
        condition: service_healthy

  native-sync-client:
    <<: *agent
    profiles: [clients]
    network_mode: service:native-sync-client-net
    command: ["python", "-m", "cynapsa_e2e.native_sync_client"]
    environment:
      <<: *agent-environment
      CYNAPSA_USERNAME: native-sync-client@mesh.test
      CYNAPSA_PASSWORD: ${NATIVE_SYNC_CLIENT_PASSWORD:?set NATIVE_SYNC_CLIENT_PASSWORD}
    depends_on:
      native-sync-client-net:
        condition: service_healthy
      ejabberd:
        condition: service_healthy

  native-async-client:
    <<: *agent
    profiles: [clients]
    network_mode: service:native-async-client-net
    command: ["python", "-m", "cynapsa_e2e.native_async_client"]
    environment:
      <<: [*agent-environment, *fault-campaign-client-environment]
      CYNAPSA_USERNAME: native-async-client@mesh.test
      CYNAPSA_PASSWORD: ${NATIVE_ASYNC_CLIENT_PASSWORD:?set NATIVE_ASYNC_CLIENT_PASSWORD}
    depends_on:
      native-async-client-net:
        condition: service_healthy
      ejabberd:
        condition: service_healthy

  monkey-sync-client:
    <<: *agent
    profiles: [clients]
    network_mode: service:monkey-sync-client-net
    command:
      - cynapsa
      - run
      - --mesh-endpoint
      - 10.240.70.2:5222
      - --username
      - monkey-sync-client@mesh.test
      - --mesh-id
      - simple-e2e
      - --password-env
      - CYNAPSA_PASSWORD
      - --command-timeout-ms
      - "30000"
      - --rpc-timeout-ms
      - "30000"
      - --map
      - https://native-server.test
      - native-server@mesh.test
      - rpc
      - --map
      - https://monkey-server.test
      - monkey-server@mesh.test
      - rpc
      - --allow
      - "*"
      - "*"
      - --
      - python
      - -m
      - cynapsa_e2e.monkey_sync_client
    environment:
      <<: *agent-environment
      CYNAPSA_USERNAME: monkey-sync-client@mesh.test
      CYNAPSA_PASSWORD: ${MONKEY_SYNC_CLIENT_PASSWORD:?set MONKEY_SYNC_CLIENT_PASSWORD}
    depends_on:
      monkey-sync-client-net:
        condition: service_healthy
      ejabberd:
        condition: service_healthy

  monkey-async-client:
    <<: *agent
    profiles: [clients]
    network_mode: service:monkey-async-client-net
    command: ["python", "-m", "cynapsa_e2e.monkey_async_client"]
    environment:
      <<: [*agent-environment, *fault-campaign-client-environment]
      CYNAPSA_USERNAME: monkey-async-client@mesh.test
      CYNAPSA_PASSWORD: ${MONKEY_ASYNC_CLIENT_PASSWORD:?set MONKEY_ASYNC_CLIENT_PASSWORD}
    depends_on:
      monkey-async-client-net:
        condition: service_healthy
      ejabberd:
        condition: service_healthy

networks:
  trunk:
    internal: true
    ipam:
      config:
        - subnet: "${CYNAPSA_E2E_TRUNK_PREFIX:-172.31.0}.0/24"
